name: Tests, Lint & Dependency Audit

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pip-audit

      # ---- Linting & formatting checks ----
      # Ruff is still advisory: its remaining findings are addressed next, in
      # their own commit. Black is enforced from here on.
      - name: Ruff (lint)
        run: ruff check .
        continue-on-error: true

      - name: Black (format check)
        run: black --check .

      # ---- Dependency vulnerability audit ----
      - name: Pip-audit (requirements.txt)
        run: pip-audit -r requirements.txt

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Each test builds a database the way a fresh install does, replaying
      # initial_db.sql then every migration in order, so this also proves the
      # migration chain still applies.
      - name: Pytest
        run: python -m pytest tests/ -q
